<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>tp pour les vacances</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!--pt formulaire-->
    <center>


    <h1>Merci de payer la ou les cotisation(s) selon le(s) sport(s)</h1>
    
    <form class="" action="index.html" method="post">

      <p class="e">choix du sport</p>
      <label for="handball">Handball</label>
      <input type="checkbox" name="choix du sport" value="Handball" checked><br>
      <label for="foot">Football</label>
      <input type="checkbox" name="choix du sport" value="Football"> <br>
      <label for="baseball">Baseball</label>
      <input type="checkbox" name="choix du sport" value="baseball"> <br>
      <label for="basket-ball">Basket-ball</label>
      <input type="checkbox" name="choix du sport" value="Basket-ball" checked>
    </form>
    <hr>
    <form class="" action="index.html" method="post">
      <p class="q">paiement par :</p>
      <label for="cb">CB</label>
      <input type="radio" name="paiement par" value="cb">
      <label for="code">votre code</label>
      <input type="password" name="code" value="" >
      <br>
      <label for="liquide">Liquide</label>
      <input type="radio" name="paiement par" value="liquide"><br>
      <label for="cheque">Chèque</label>
      <input type="radio" name="paiement par" value="cheque">
    </form>
    <hr>
    <form class="" action="index.html" method="post">
      <p class="s">zone de boutton</p>
      <input type="submit" name="boutton" value="valider">
      <input type="submit" name="boutton" value="Effacer">

    </form>

    </center>
  </body>
</html>
